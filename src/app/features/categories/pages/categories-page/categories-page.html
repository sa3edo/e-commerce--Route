@if(!allCategories){
  <div class="flex justify-center py-10">
    <app-loading-spinner />
  </div>
}@else {
  <section class="py-4">
    <app-section-title [title]="'All Categories'"/>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
      @for(cat of allCategories; track $index){
        <a href="" [routerLink]="['specific-category/',cat._id]">

          <div
          [style.animationDelay]="$index * 0.1 + 's'"
          class="card h-full border-2 flex flex-col justify-between border-gray-200 border-opacity-60 rounded-lg overflow-hidden transition-transform duration-300 hover:scale-105 shadow-lg"
          >
          <img
          class="lg:h-48 md:h-36 w-full object-contain object-center bg-white p-4"
          [src]="cat.image"
          [alt]="cat.name"
          />
          <div class="p-6 flex flex-col justify-between flex-1">
            <h1 class="title-font text-lg font-medium text-gray-900 mb-3 text-center">
              {{ cat.name }}
            </h1>
          </div>
        </div>
      </a>
      }
    </div>
  </section>
}
