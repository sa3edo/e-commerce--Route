<div class="max-w-md mx-auto mt-20 p-6 border rounded shadow-lg bg-white">

  @if(step === 'request'){
    <h2 class="text-xl font-bold mb-4 text-center">Forgot Password</h2>
    <input
      type="email"
      [(ngModel)]="email"
      placeholder="Enter your email"
      class="w-full border p-2 rounded mb-4 focus:outline-none focus:ring-2 focus:ring-main-500"
    />
    <button
      class="w-full bg-main-500 text-white p-2 rounded hover:bg-main-600 transition"
      (click)="requestReset()"
      [disabled]="isLoading"
    >
      @if(!isLoading){ Send Reset Code }@else{ Sending... }
    </button>
  }

  @if(step === 'verify'){
    <h2 class="text-xl font-bold mb-4 text-center">Verify Code & Reset</h2>

    @for(field of fields ; track $index){
      <input
        [type]="field.type"
        [placeholder]="field.placeholder"
        [value]="field.name==='newPassword'?newPassword:code"
        (input)="field.name==='newPassword'?newPassword=$event.target.value:code=$event.target.value"
        class="w-full border p-2 rounded mb-4 focus:outline-none focus:ring-2 focus:ring-main-500"
      />
    }

    <button
      class="w-full bg-main-500 text-white p-2 rounded hover:bg-main-600 transition"
      (click)="verifyCode()"
      [disabled]="isLoading"
    >
      @if(!isLoading){ Reset Password }@else{ Verifying... }
    </button>
  }

</div>
