<form [formGroup]="loginForm"
(ngSubmit)="onSubmit()">
  <div class="px-12 py-4">
    <div class="relative w-full mb-2">

      <input
        formControlName="email"
        type="email"
        id="email"
        placeholder=" "

        class="peer block w-full rounded-lg border border-gray-300 bg-transparent px-2.5 pb-2.5 pt-4 text-sm text-gray-900 focus:outline-none focus:ring-0 dark:border-gray-600"
      />
      <label

        for="email"
        class="absolute start-1 top-2 z-10 origin-[0] -translate-y-4 scale-75 transform bg-white px-2 text-sm text-gray-500 duration-300 peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:scale-100 peer-focus:top-2 peer-focus:-translate-y-4 peer-focus:scale-75"
      >
        Email Address
      </label>
    </div>
    <div class="relative w-full mb-2">

      <input
        formControlName="password"
        type="password"
        id="password"
        placeholder=" "
        class="peer block w-full rounded-lg border border-gray-300 bg-transparent px-2.5 pb-2.5 pt-4 text-sm text-gray-900 focus:outline-none focus:ring-0 dark:border-gray-600"
      />
      <label

        for="password"
        class="absolute start-1 top-2 z-10 origin-[0] -translate-y-4 scale-75 transform bg-white px-2 text-sm text-gray-500 duration-300 peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:scale-100 peer-focus:top-2 peer-focus:-translate-y-4 peer-focus:scale-75"
      >
        Password
      </label>
    </div>
    <button
      [disabled]="isLoading"
      type="submit"
      class="min-w-[250px] disabled:bg-gray-500 disabled:cursor-auto block mx-auto text-2xl py-2 mt-8 rounded-full bg-main-400 cursor-pointer hover:bg-main-700 duration-300 text-gray-100 focus:outline-none"
    >
      Login @if(isLoading){
      <i class="fas fa-spinner fa-spin"></i>
      }
    </button>
    <!-- Error message from server -->
    @if(errorMessage){
    <div
      class="response-msg bg-red-100 border-l-4 my-4 text-2xl font-light border-red-500 text-red-700 p-4"
      role="alert"
    >
      <p>{{ errorMessage }}</p>
    </div>
    }
  </div>
</form>
