<aside class="w-64 bg-white shadow-md rounded-lg p-4 h-full sticky top-20">
  <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center gap-2">
    <i class="fas fa-list text-main-500"></i> Categories
  </h3>

  <ul class="space-y-2">
    @for(cat of categories; track cat._id) {
    <li #catList class="rounded-md transition-item ">
      <!-- Category Header -->
      <div
        (click)="toggleCategory(cat._id)"
        class="flex items-center justify-between gap-3 p-2 rounded-md  hover:bg-main-100 transition"
      >
        <div (click)="toggleClass(catList)" class="flex items-center cursor-pointer w-full gap-3" >
          <img
            [src]="cat.image"
            alt="{{ cat.name }}"
            class="w-10 h-10 object-cover rounded-md border"
          />
          <span  class="text-gray-700 font-medium">{{ cat.name }}</span>
        </div>
        <div (click)="toggleClass(catList)" class=" size-12 flex cursor-pointer justify-center items-center ">

          <i
          
          class="fas  "
          [class]="{
            'fa-chevron-down': openedCategory !== cat._id,
            'fa-chevron-up': openedCategory === cat._id
          }"
        ></i>
      </div>
      </div>

      <!-- Subcategories Dropdown -->
      
      <div class="sub-list">
        @for(sub of subCategoryMap[cat._id]; track sub._id) {
        <ul class="pl-5 mt-2 space-y-1 border-l-2 border-main-200">
          <li
            class="text-sm text-gray-600 cursor-pointer hover:text-main-500 transition"
          >
            <div class="flex items-center mb-4">
              <input
                id="default-checkbox"
                type="checkbox"
                value=""
                class="w-4 h-4 text-main-600 bg-gray-100 border-gray-300 rounded-sm focus:ring-main-500 focus:ring-2"
              />
              <label
                for="default-checkbox"
                class="ms-2 text-sm font-medium text-gray-900"
                >{{ sub.name }}</label
              >
            </div>
          </li>
        </ul>

        } @empty {
        <div
          class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4"
          role="alert"
        >
          <p class="text-sm">No subcategories available.</p>
        </div>
        }
      </div>
      
    </li>
    <hr class="my-2" />
    }
  </ul>
</aside>
