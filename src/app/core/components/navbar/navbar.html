<nav class="bg-main-500 shadow-md fixed right-0 left-0 z-30">
  <div class="container mx-auto flex flex-wrap items-center justify-between p-4">
    <!-- Logo -->
    <a routerLink="/home" class="flex items-center space-x-2">
      <i class="fa-solid fa-cart-shopping text-main-900 me-0 text-2xl"></i>
      <span class="text-2xl font-bold text-white">Freshcart</span>
    </a>

    <!-- Right Side Buttons -->
    <div class="flex md:order-2 items-center space-x-2">
      @if(!isLoggedIn){
        <a routerLink="/signin">
          <button
            type="button"
            class="text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 
                   font-medium rounded-lg text-sm px-4 py-2 transition"
          >
            Sign In
          </button>
        </a>
        <a routerLink="/signup">
          <button
            type="button"
            class="text-main-500 bg-white hover:bg-gray-100 focus:ring-4 focus:ring-main-200 
                   font-medium rounded-lg text-sm px-4 py-2 transition"
          >
            Sign Up
          </button>
        </a>
      }
      @if(isLoggedIn){
        <button
          type="button"
          (click)="logout()"
          class="text-white bg-red-500 hover:bg-red-600 focus:ring-4 focus:ring-red-300 
                 font-medium rounded-lg text-sm px-4 py-2 transition"
        >
          Logout
        </button>
      }

      <!-- Mobile Menu Button -->
      <button
        data-collapse-toggle="navbar-cta"
        type="button"
        class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-white rounded-lg 
               md:hidden hover:bg-main-600 focus:outline-none focus:ring-2 focus:ring-white"
        aria-controls="navbar-cta"
        aria-expanded="false"
      >
        <span class="sr-only">Open main menu</span>
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>

    <!-- Links (Only if Logged In) -->
    @if(isLoggedIn){
      <div
        class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1"
        id="navbar-cta"
      >
        <ul class="flex flex-col md:flex-row md:space-x-6 font-medium mt-4 md:mt-0 text-white">
          <li>
            <a routerLink="/home" class="hover:text-gray-200 transition">Home</a>
          </li>
          <li>
            <a routerLink="cart" class="hover:text-gray-200 transition">Cart</a>
          </li>
          <li>
            <a routerLink="products" class="hover:text-gray-200 transition">Products</a>
          </li>
          <li>
            <a routerLink="categories" class="hover:text-gray-200 transition">Categories</a>
          </li>
          <li>
            <a routerLink="brands" class="hover:text-gray-200 transition">Brands</a>
          </li>
        </ul>
      </div>
    }
  </div>
</nav>

<app-sweet-alert
  title="Logout Confirmation"
  text="Do you really want to logout?"
  confirmButtonText="Yes, Logout"
  cancelButtonText="Stay"
  (onConfirm)="onConfirmed()"
></app-sweet-alert>
